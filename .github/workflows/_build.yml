name: Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      artifact-name:
        type: string
        default: latex-build
      retention-days:
        type: number
        default: 30

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify manuscript math style
        run: python3 scripts/verify-math-style.py

      - name: Install LuaLaTeX and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Build PDF
        run: |
          mkdir -p out
          max_print_line=1000 latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error -outdir=out main.tex

      - name: Verify PDF and collect build metadata
        run: |
          pdffonts out/main.pdf > out/fonts.txt
          python3 scripts/verify-build.py out
        env:
          COMMIT: ${{ inputs.ref || github.sha }}

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            out/main.pdf
            out/build-info.json
            out/fonts.txt
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.artifact-name }}
          path: out/*.log
          retention-days: 7
